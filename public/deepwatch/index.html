<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Deepwatch</title>
  <meta name="description" content="A YouTube interface with a recommendation system built for learning, not dopamine.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%235eead4'/><path d='M12 9l11 7-11 7z' fill='white'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="top-l">
      <button class="icon-btn" id="menu-btn" data-act="nav" aria-label="Toggle menu"></button>
      <a class="logo" href="#/"><span class="logo-mark"><svg viewBox="0 0 24 24"><path d="M9 7l8 5-8 5z" fill="currentColor"/></svg></span>Deepwatch</a>
    </div>
    <form id="search" class="search" role="search">
      <input id="search-input" type="search" placeholder="Search your library" aria-label="Search" autocomplete="off">
      <button id="search-btn" type="submit" aria-label="Search"></button>
    </form>
    <div class="top-r">
      <a id="goal" class="goal" href="#/progress"></a>
      <button class="icon-btn" id="theme-btn" data-act="theme" aria-label="Toggle theme"></button>
    </div>
  </header>
  <nav class="nav" id="nav" aria-label="Main"></nav>
  <div class="nav-scrim" data-act="nav"></div>
  <main id="view"></main>
  <div id="toasts" aria-live="polite"></div>
  <div id="modal" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
